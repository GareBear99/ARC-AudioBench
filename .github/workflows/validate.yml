name: Validate ARC-AudioBench

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate test tones
        run: python3 scripts/generate_test_tones.py
      - name: Analyze a tone and validate the result
        run: |
          python3 scripts/analyze_wav.py data/test_tones/sine_1000hz.wav --out results/sine_1000hz.analysis.json
          python3 scripts/validate_results.py results/sine_1000hz.analysis.json
      - name: Batch analyze
        run: python3 scripts/batch_analyze.py data/test_tones --out results/batch
      - name: Alias test (band-limited sawtooth must pass)
        run: python3 scripts/alias_test.py data/test_tones/sawtooth_bandlimited_997hz.wav --f0 997 --out results/alias/sawtooth_bandlimited_997hz.alias.json
      - name: Alias test (naive sawtooth must fail -- negative control)
        run: |
          if python3 scripts/alias_test.py data/test_tones/sawtooth_naive_997hz.wav --f0 997 --out results/alias/sawtooth_naive_997hz.alias.json; then
            echo "ERROR: naive sawtooth passed the alias test -- the test is not detecting aliasing"
            exit 1
          fi
      - name: NMR test (band-limited sawtooth must pass)
        run: python3 scripts/nmr_test.py data/test_tones/sawtooth_bandlimited_997hz.wav --f0 997 --out results/nmr/sawtooth_bandlimited_997hz.nmr.json
      - name: NMR test (naive sawtooth must fail -- negative control)
        run: |
          if python3 scripts/nmr_test.py data/test_tones/sawtooth_naive_997hz.wav --f0 997 --out results/nmr/sawtooth_naive_997hz.nmr.json; then
            echo "ERROR: naive sawtooth passed the NMR test -- the test is not detecting masking violations"
            exit 1
          fi
      - name: Cramping test (highpass must pass, peaking must fail -- negative control)
        run: |
          python3 scripts/cramping_test.py data/test_tones/sweep_highpass_8000hz.wav --type highpass --fc 8000 --q 0.707 --out results/cramping/sweep_highpass_8000hz.cramping.json
          if python3 scripts/cramping_test.py data/test_tones/sweep_peaking_8000hz.wav --type peaking --fc 8000 --q 1.0 --gain-db 12.0 --out results/cramping/sweep_peaking_8000hz.cramping.json; then
            echo "ERROR: peaking sweep passed the cramping test -- the test is not detecting cramping"
            exit 1
          fi
      - name: STOI test (synthetic corpus reproduces committed scores)
        run: |
          python3 scripts/stoi_test.py data/test_tones/stoi_speech_like.wav data/test_tones/stoi_speech_like.wav --out results/stoi/speech_like_vs_clean.stoi.json
          python3 scripts/stoi_test.py data/test_tones/stoi_speech_like.wav data/test_tones/stoi_speech_like_vocoded.wav --out results/stoi/speech_like_vs_vocoded.stoi.json
      - name: Freeze-blur test (frozen vowel reproduces committed blur)
        run: |
          python3 scripts/freeze_blur_test.py data/test_tones/freeze_vibrato_vowel_frozen.wav --f0 110 --compare data/test_tones/freeze_vibrato_vowel.wav --out results/freeze-blur/frozen_vs_vibrato.freeze.json
      - name: Test suite (49 tests, 0 failures required)
        run: python3 -m unittest discover -s tests -v
      - name: Report
        run: python3 scripts/report_results.py results --out reports/index.html --markdown reports/summary.md
      - name: Validate repo
        run: python3 scripts/validate_repo.py
